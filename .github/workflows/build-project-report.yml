name: Build Project Report

on:
  push:
    branches:
      - codex/e0-e05
    paths:
      - ".report-build/report_source.md"
      - "scripts/build_project_report.py"
      - ".github/workflows/build-project-report.yml"

permissions:
  contents: write

jobs:
  build-project-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install report build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install python-docx matplotlib numpy

      - name: Build Word project report
        run: |
          python scripts/build_project_report.py

      - name: Commit generated Word report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project_report/Project_Report_Transportability_Reliability_NIDS.docx
          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "Build project report Word artifact"
            git push origin HEAD:codex/e0-e05
          fi
